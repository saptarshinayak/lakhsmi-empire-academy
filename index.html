<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakhsmi Empire Academy (Dumdum)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="header-title">
                <span class="title-line-1">LAKHSMI EMPIRE</span>
                <span class="title-line-2">ACADEMY (DUMDUM)</span>
            </h1>
            <div class="gold-divider"></div>
        </header>

        <!-- Martial Arts Section -->
        <section class="activity-section martial-arts">
            <div class="activity-bg martial-arts-bg">
                <h2 class="activity-title">MARTIAL ARTS</h2>
            </div>
            <div class="activity-image martial-arts-image">
                <img src="assets/martial-arts.webp" alt="Martial Arts Training" onerror="this.style.display='none'">
            </div>
            <div class="gold-divider"></div>
        </section>

        <!-- Chess Section -->
        <section class="activity-section chess">
            <div class="activity-bg chess-bg">
                <h2 class="activity-title">CHESS</h2>
            </div>
            <div class="activity-image chess-image">
                <img src="assets/chess.jpg" alt="Chess Game" onerror="this.style.display='none'">
            </div>
            <div class="gold-divider"></div>
        </section>

        <!-- Abacus Section -->
        <section class="activity-section abacus">
            <div class="activity-bg abacus-bg">
                <h2 class="activity-title">ABACUS</h2>
            </div>
            <div class="activity-image abacus-image">
                <img src="assets/abacus.jpg" alt="Abacus Learning" onerror="this.style.display='none'">
            </div>
            <div class="gold-divider"></div>
        </section>

        <!-- Extracurricular Activities Banner -->
        <section class="extracurricular-banner">
            <h2 class="extracurricular-title">EXTRACURRICULAR ACTIVITIES/TUITIONS</h2>
        </section>

        <!-- Creative Activities Image Section -->
        <section class="creative-section">
            <div class="creative-image">
                <img src="assets/creative.jpg" alt="Creative Activities" onerror="this.style.display='none'">
            </div>
            <div class="gold-divider"></div>
        </section>

        <!-- Contact Section -->
        <footer class="contact-section">
            <div class="contact-content">
                <span class="phone-icon">📞</span>
                <span class="contact-text">Call / WhatsApp : 8910634411</span>
            </div>
        </footer>
    </div>
</body>
</html>
